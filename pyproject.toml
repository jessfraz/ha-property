[project]
name = "ha-property-home-assistant"
version = "0.1.2"
description = "Home Assistant adapter for Property"
requires-python = ">=3.14.2"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "gazetteer-matcher==1.1.0",
  "hassil==3.12.1",
  "home-assistant-intents==2026.10.27",
  "playwright==1.64.1",
  "pytest-homeassistant==2026.11.0",
  "aiohasupervisor==0.8.1",
  "ruff==0.17.3",
  "ty==0.0.95",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests_ha"]
addopts = "--strict-markers -p no:respx"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.per-file-target-version]
"scripts/*" = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]

[tool.uv]
package = false
