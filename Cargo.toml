[package]
name = "property"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "An evidence-backed property tax ledger for Home Assistant"
repository = "https://github.com/jessfraz/ha-property"
default-run = "property"

[[bin]]
name = "property"
path = "src/main.rs"

[[bin]]
name = "ha-property"
path = "src/bin/ha-property.rs"

[dependencies]
anyhow = "1"
dropshot = "0.18"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ha-app-ui = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.3" }
ha-app-kit-ha = { git = "https://github.com/jessfraz/ha-app-kit", tag = "v0.1.3" }
hex = "0.4"
getrandom = "0.4"
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["chrono", "uuid1"] }
semver = "1"
sha2 = "0.11"
slog = "2"
# Includes the SQLite fix for RUSTSEC-2026-0459 absent from registry 0.9.0.
sqlx = { version = "0.9", git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
tempfile = "3"
